name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run tests
        run: |
          xcodebuild -version
          swift --version
          scripts/test.sh

      - name: Build and verify local release artifact
        run: |
          scripts/release.sh --skip-tests --repository example/BetterTot
          ruby -c dist/release/bettertot.rb
