name: Tagged Build

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

env:
  DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 25

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tagged source
        id: release-source
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          expected="v$version"
          if [[ "$GITHUB_REF_NAME" != "$expected" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match VERSION ($expected)" >&2
            exit 1
          fi
          if [[ "$(git cat-file -t "$GITHUB_REF_NAME")" != "tag" ]]; then
            echo "Tagged builds require an annotated tag" >&2
            exit 1
          fi
          if ! [[ -f LICENSE && -f NOTICE ]]; then
            echo "Apache 2.0 LICENSE and NOTICE are required for a tagged build" >&2
            exit 1
          fi
          notes="docs/releases/$version.md"
          if [[ ! -f "$notes" ]]; then
            echo "Release notes are missing: $notes" >&2
            exit 1
          fi
          if ! git show-ref --verify --quiet refs/remotes/origin/main; then
            echo "origin/main is unavailable in the full checkout" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/main"; then
            echo "Tagged commit must be in main history" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Test and build ad-hoc artifact
        env:
          VERSION: ${{ steps.release-source.outputs.version }}
        run: |
          set -euo pipefail
          xcodebuild -version
          swift --version
          scripts/release.sh \
            --version "$VERSION" \
            --build-number "$GITHUB_RUN_NUMBER" \
            --sign-identity -

      - name: Stage tagged artifact
        env:
          VERSION: ${{ steps.release-source.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist/tagged
          cp \
            "dist/release/BetterTot-$VERSION.zip" \
            "dist/release/BetterTot-$VERSION.pkg" \
            "dist/release/BetterTot-$VERSION.sha256" \
            dist/tagged/
          cp "docs/releases/$VERSION.md" dist/tagged/release-notes.md
          printf '%s\n' \
            'UNNOTARIZED AD-HOC BUILD' \
            '' \
            'The app is ad-hoc signed; the installer is unsigned.' \
            'Neither artifact has been notarized by Apple.' \
            'It is a repository-scoped tagged artifact, not a public GitHub Release.' \
            'An explicit local Gatekeeper override may be required.' \
            "Source tag: $GITHUB_REF_NAME" \
            "Source commit: $GITHUB_SHA" \
            "Workflow run: $GITHUB_RUN_NUMBER" \
            > dist/tagged/TAGGED-BUILD-NOTICE.txt

      - name: Upload tagged artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: BetterTot-v${{ steps.release-source.outputs.version }}-${{ github.sha }}
          path: dist/tagged
          if-no-files-found: error
          retention-days: 90
